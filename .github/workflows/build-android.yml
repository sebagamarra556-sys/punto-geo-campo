name: Generar APK Android

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar Gradle
        run: |
          curl -sSL https://services.gradle.org/distributions/gradle-8.11.1-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo /opt/gradle-8.11.1/bin >> $GITHUB_PATH
      - name: Compilar APK de prueba
        run: gradle -p android assembleDebug --no-daemon
      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Punto-Geo-Campo-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

